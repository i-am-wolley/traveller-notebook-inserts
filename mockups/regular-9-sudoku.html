'position:absolute;left:19.94mm;top:49.84mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>3</div><div style='position:absolute;left:39.87mm;top:49.84mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>8</div><div style='position:absolute;left:79.75mm;top:49.84mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>1</div><div style='position:absolute;left:0.00mm;top:59.81mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>6</div><div style='position:absolute;left:59.81mm;top:59.81mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>3</div><div style='position:absolute;left:79.75mm;top:59.81mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>2</div><div style='position:absolute;left:0.00mm;top:69.78mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>3</div><div style='position:absolute;left:29.91mm;top:69.78mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>2</div><div style='position:absolute;left:69.78mm;top:69.78mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>4</div><div style='position:absolute;left:29.91mm;top:79.75mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>3</div><div style='position:absolute;left:39.87mm;top:79.75mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>4</div><div style='position:absolute;left:79.75mm;top:79.75mm;width:9.97mm;height:9.97mm;line-height:9.97mm;text-align:center;font-size:11.00pt;font-weight:700'>9</div></div></div></div></div></div><script>const SEED = 1333;
const INK = "#243a63";
const INK_ALT = "#2b2b33";
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand ITC", cursive';
const YEAR = "2026";
const UPTO = 291;
const COVER_SIZE = "34pt";
const NAME_SIZE = "9pt";
const TOTAL_SIZE = "7pt";
const NOTE_SIZE = "7.5pt";
const FILM_SIZE = "4.6pt";
const COUNT_SIZE = "6pt";
const HABIT_NAMES = ['Walked', 'Gym', 'Read', 'No alcohol', 'Wrote'];
const HABIT_DENSITY = [0.78, 0.34, 0.55, 0.62, 0.41];
const HABIT_OFFSET = 3;
const WATCHED = [["F Dune Part Two", "T Shogun", "F Challengers", "T Fallout", "F Civil War"], ["F Furiosa", "T Baby Reindeer", "F Inside Out 2"], ["F Twisters", "T The Bear S3", "F Alien Romulus", "F The Substance", "T Ripley", "F The Wild Robot"], ["F Anora", "F Conclave", "T 3 Body Problem", "F Heretic"], ["F Gladiator II", "T The Penguin", "F Wicked", "F Nosferatu", "F The Brutalist", "T Agatha All Along", "F A Real Pain"], ["F Sing Sing", "F Longlegs", "T Arcane S2", "F The Fall Guy", "F Emilia Perez"], ["F Trap", "F Blitz", "T Slow Horses S4", "F Kinds of Kindness", "F A Minecraft Mv", "F Sinners", "T Industry S3", "F Thunderbolts"], ["F Final Reckoning", "F Lilo & Stitch", "F F1", "T Disclaimer", "F Superman", "F Fantastic Four"], ["F Weapons", "T Mr & Mrs Smith", "F 28 Years Later", "T Say Nothing"], ["F Materialists", "T True Det: Night"], [], []];
const FILM_OFFSET = 0;
const NOTE_LINES = ['Best month was June — walked almost every day,', 'and it shows. Three weeks without a bad day.', '', 'October fell apart. Worth remembering that the', 'gym streak broke first, about ten days before', 'the grid went grey.', '', 'Next year: fewer habits, bigger squares.'];

// ---- seeded randomness, so the mockups are stable between runs -------------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd = mulberry32(SEED);
const between = (a,b)=>a+rnd()*(b-a);
const pick = a => a[Math.floor(rnd()*a.length)];
const NS = "http://www.w3.org/2000/svg";

function overlay(el){
  const cs = getComputedStyle(el);
  if (cs.position === "static") el.style.position = "relative";
  const r = el.getBoundingClientRect();
  const svg = document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);
  svg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none";
  el.appendChild(svg);
  return [svg, r.width, r.height];
}

// a shaded square: rough edges, slight rotation, uneven ink
function shade(td){
  const [svg,w,h] = overlay(td);
  const i = between(0.02,0.11)*w;
  const j = () => between(-0.055,0.055)*w;
  const p = document.createElementNS(NS,"path");
  const x0=i+j(), y0=i+j(), x1=w-i+j(), y1=h-i+j();
  p.setAttribute("d",
    `M${x0},${y0} Q${(x0+x1)/2+j()},${y0+j()} ${x1},${y0+j()}`+
    ` Q${x1+j()},${(y0+y1)/2} ${x1+j()},${y1}`+
    ` Q${(x0+x1)/2+j()},${y1+j()} ${x0+j()},${y1+j()}`+
    ` Q${x0+j()},${(y0+y1)/2} ${x0},${y0} Z`);
  p.setAttribute("fill", rnd()<0.12 ? INK_ALT : INK);
  p.setAttribute("opacity", between(0.80,0.95).toFixed(2));
  p.setAttribute("transform", `rotate(${between(-3,3).toFixed(1)} ${w/2} ${h/2})`);
  svg.appendChild(p);
}

// a crossed-out square: two bowed strokes that overshoot a little
function cross(td){
  const [svg,w,h] = overlay(td);
  const i = 0.14*w;                       // keep the X inside its own cell
  const o = () => between(-0.06,0.06)*w;  // just enough wobble to look drawn
  const ink = rnd()<0.12 ? INK_ALT : INK;
  for (const [a,b,c,d] of [[i,i,w-i,h-i],[w-i,i,i,h-i]]){
    const l = document.createElementNS(NS,"path");
    l.setAttribute("d", `M${a+o()},${b+o()} Q${w/2+o()},${h/2+o()} ${c+o()},${d+o()}`);
    l.setAttribute("stroke", ink);
    l.setAttribute("fill","none");
    l.setAttribute("stroke-width", (w*between(0.065,0.095)).toFixed(2));
    l.setAttribute("stroke-linecap","round");
    l.setAttribute("opacity", between(0.78,0.95).toFixed(2));
    svg.appendChild(l);
  }
}

// handwriting, with a little rotation and baseline drift per run
function write(el, text, opts){
  opts = opts || {};
  const s = document.createElement("span");
  s.textContent = text;
  s.style.cssText =
    `font-family:${HAND};color:${opts.ink||INK};white-space:nowrap;`+
    `font-size:${opts.size||"6pt"};line-height:1;`+
    `display:inline-block;transform:rotate(${between(-1.6,1.6).toFixed(2)}deg)`+
    ` translateY(${between(-0.4,0.4).toFixed(2)}mm);`+
    (opts.css||"");
  el.appendChild(s);
  return s;
}

function floatWrite(host, text, x, y, opts){
  opts = opts || {};
  const cs = getComputedStyle(host);
  if (cs.position === "static") host.style.position = "relative";
  const d = document.createElement("div");
  d.style.cssText = `position:absolute;left:${x};top:${y};pointer-events:none`;
  host.appendChild(d);
  return write(d, text, opts);
}

// ---- the grids -------------------------------------------------------------
// live cells only: never touch a dead date or the 29 Feb square
function liveRows(table){
  return [...table.rows].filter(r => r.querySelector("td.cell"));
}

// Days are sticky: yesterday pulls today toward itself, which is what makes
// real tracker grids read as runs and slumps rather than static.
const STICK = 0.42;
function fillYearGrid(table, upto, pGood, pBad){
  let prev = 1;
  const pCross = pBad > 0 ? pBad / Math.max(0.01, 1 - pGood) : 0;
  liveRows(table).forEach((row, m) => {
    [...row.cells].forEach((td, i) => {
      if (!td.classList.contains("cell")) return;
      if (m*31 + i > upto) return;         // the year is still in progress
      const p = pGood + STICK * (prev - pGood);
      const on = rnd() < p;
      prev = on ? 1 : 0;
      if (on) shade(td);
      else if (rnd() < pCross) cross(td);
    });
  });
}

function fillBlank(el, text, size){
  // write over a "total ______" style rule
  const t = el.textContent;
  el.textContent = "";
  const before = document.createTextNode(t.split("___")[0]);
  el.appendChild(before);
  write(el, text, {size: size || "6.5pt"});
  el.appendChild(document.createTextNode(t.split("/").slice(-1)[0] ? " / "+t.split("/").slice(-1)[0].trim() : ""));
}

// ---- per-page behaviour ----------------------------------------------------
function run(){
  const kind = document.body.dataset.kind;
  const pad = document.querySelector(".turn") || document.querySelector(".pad");

  if (kind === "cover"){
    const box = document.querySelector(".wbox");
    box.style.position = "relative";
    floatWrite(box, YEAR, "50%", "50%", {
      size: COVER_SIZE,
      css: "transform-origin:center;"});
    const sp = box.lastChild.firstChild;
    box.lastChild.style.transform = "translate(-50%,-55%)";
  }

  if (kind === "glance"){
    const t = pad.querySelector("table.g");
    fillYearGrid(t, UPTO, 0.72, 0.13);
  }

  if (kind === "habits"){
    const names = [...pad.querySelectorAll(".nameline")];
    const tables = [...pad.querySelectorAll("table.g")];
    const totals = [...pad.querySelectorAll(".sub")].filter(e => e.textContent.includes("365"));
    names.forEach((n, k) => {
      const idx = HABIT_OFFSET + k;
      if (idx >= HABIT_NAMES.length) return;      // the last rule stays blank
      n.style.position = "relative";
      floatWrite(n, HABIT_NAMES[idx], "1mm", "-0.4mm", {size: NAME_SIZE});
    });
    tables.forEach((t, k) => {
      const idx = HABIT_OFFSET + k;
      if (idx >= HABIT_NAMES.length) return;
      fillYearGrid(t, UPTO, HABIT_DENSITY[idx], 0);
    });
    totals.forEach((el, k) => {
      const idx = HABIT_OFFSET + k;
      if (idx >= HABIT_NAMES.length) return;
      const n = Math.round(UPTO * HABIT_DENSITY[idx] * 0.97);
      el.innerHTML = "total ";
      write(el, String(n), {size: TOTAL_SIZE});
      el.appendChild(document.createTextNode(" / 365"));
    });
  }

  if (kind === "films"){
    const tables = pad.querySelectorAll("table.g");
    const grid = tables[0], axis = tables[1];
    const rows = [...grid.rows];
    const cols = rows[0].cells.length;
    let sum = 0;
    for (let c = 0; c < cols; c++){
      const month = WATCHED[FILM_OFFSET + c] || [];
      sum += month.length;
      for (let k = 0; k < month.length && k < rows.length; k++){
        const td = rows[rows.length - 1 - k].cells[c];   // stack upward
        td.style.position = "relative";
        floatWrite(td, month[k], "0.5mm", "0.3mm",
                   {size: FILM_SIZE, ink: rnd() < 0.15 ? INK_ALT : INK});
      }
      const cell = axis.rows[1].cells[c];
      cell.style.position = "relative";
      if (month.length) floatWrite(cell, String(month.length), "50%", "4%",
                           {size: COUNT_SIZE, css:"transform:translateX(-50%)"});
    }
    const tot = [...pad.querySelectorAll(".sub")].filter(e => e.textContent.includes("Total"))[0];
    if (tot){
      tot.innerHTML = tot.textContent.split("___")[0];
      write(tot, String(sum), {size: TOTAL_SIZE});
    }
  }

  if (kind === "notes"){
    const rules = [...pad.querySelectorAll("div")].filter(
      d => (d.getAttribute("style")||"").includes("border-bottom"));
    NOTE_LINES.forEach((line, k) => {
      if (!line || k >= rules.length) return;
      rules[k].style.position = "relative";
      floatWrite(rules[k], line, "1mm", "-0.2mm", {size: NOTE_SIZE});
    });
  }
}
document.addEventListener("DOMContentLoaded", run);
</script></body></html>
